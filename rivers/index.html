<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>Rivers — databaseprojects</title>
  <link rel="stylesheet" href="../css/site.css?v=20261011a">
  <link rel="stylesheet" href="../css/rivers.css?v=20261025j">
</head>
<body>
  <div class="sheet">
    <nav class="bk-nav" aria-label="Index"><a href="../">Home</a><a href="../vacant-storefronts/">Vacant</a><a href="../broken/" hidden>Broken</a><a href="../found-photographs/">Found Photographs</a><a href="../restricted-area/" hidden>Restricted Area</a><a href="../dogs-waiting-out-front/" hidden>Dogs Waiting Out Front</a><a href="../front-entrance-statues/" hidden>Front Entrance Statues</a><a href="../car-colours/">Car Colours</a><a href="../convenient-store-colors/">Convenience Store Colours</a><a href="../ski-hills/">Ski Hills</a><a href="../bike-routes/">Bike Routes</a><a href="../rivers/" class="active" aria-current="page">Rivers</a><!-- hidden: <a href="../keyword-scraping/">Keyword Scraping</a> --><a href="../info/">INFO</a></nav>

<main>
  <div class="rv-bar">
    <h1 class="rv-name" id="rv-title">Rivers</h1>
    <p class="rv-set" id="rv-set">BC</p>
  </div>
  <div class="rv-find-row">
    <div class="rv-find-wrap">
      <input class="rv-find" id="rv-find" type="search" placeholder="Search rivers" aria-label="Search rivers" autocomplete="off" spellcheck="false">
      <button type="button" class="rv-find-clear" id="rv-find-clear" hidden aria-label="Clear search">×</button>
    </div>
    <div class="rv-views" id="rv-views" role="group" aria-label="View">
      <button type="button" class="rv-tag" id="rv-view-map" aria-pressed="false">Map</button>
      <button type="button" class="rv-tag rv-on" id="rv-view-grid" aria-pressed="true">Grid</button>
    </div>
  </div>
  <div class="rv-regions" id="rv-regions" role="group" aria-label="Region"></div>
  <p class="rv-empty" id="rv-empty" hidden>No rivers match</p>
  <div class="rv-row" id="rv-row"></div>
  <div class="rv-map-wrap" id="rv-map-wrap" hidden>
    <div class="rv-map" id="rv-map" role="region" aria-label="River map"></div>
    <div class="rv-map-chip" id="rv-map-chip" hidden>
      <button type="button" class="rv-map-chip-x" id="rv-map-chip-x" aria-label="Clear selection">×</button>
      <p class="rv-map-chip-name" id="rv-map-chip-name"></p>
      <p class="rv-map-chip-region" id="rv-map-chip-region"></p>
      <button type="button" class="rv-tag" id="rv-map-chip-open">Open</button>
    </div>
    <p class="rv-map-legend">
      <span class="rv-map-key rv-map-key-mouth">River mouth</span>
      <span class="rv-map-key rv-map-key-area">Area centre</span>
    </p>
  </div>
  <div class="rv-notes" id="rv-notes" hidden></div>
  <div class="rv-credit" id="rv-credit"></div>
</main>

  </div>
  <script src="../js/rivers.js?v=20261025j"></script>
</body>
</html>
