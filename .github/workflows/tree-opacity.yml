# Fail a pull request when a tree file it adds or changes bakes a band
# opacity that is not in ski-hills/tree-opacity.json. Unchanged files with
# an older bake are warnings. The CSS block and js/ski-hills.js TREE_STEP
# must match the same table.

name: Tree opacity

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Check tree-band opacities
        run: python3 ski-hills/check-tree-opacity.py --base "origin/${{ github.base_ref }}"
