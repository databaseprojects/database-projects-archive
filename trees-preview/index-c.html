<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trees of Vancouver — Posters (preview C)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#1d1d1b}
body{font-family:Georgia,"Times New Roman",Times,serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
.mark{position:absolute;top:1.6rem;left:2rem;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:#77776f;margin:0}
.poster{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6vh 2rem 7vh;margin:0}
.poster+.poster{border-top:1px solid #ecece6}
.poster img{display:block;width:auto;height:auto;max-width:min(88vw,900px);max-height:70vh;max-height:70svh}
.poster figcaption{text-align:center;margin-top:3.2vh}
.poster h2{font-weight:normal;font-size:clamp(1.7rem,3.2vw,2.6rem);letter-spacing:.02em;margin:0;line-height:1.15}
.poster .lat{font-style:italic;font-size:clamp(1rem,1.5vw,1.25rem);color:#3a3a35;margin:.35rem 0 1.1rem}
.poster .lat i{font-style:italic}
.poster .co{font-size:.7rem;letter-spacing:.16em;color:#77776f;margin:0}
.poster .co::before{content:"";display:block;width:2.2rem;height:1px;background:#b9b9b1;margin:0 auto 1rem}
@media (max-width:600px){
 .mark{left:1.1rem;top:1.2rem}
 .poster{padding:4.5rem 1.1rem 3.5rem;min-height:auto}
 .poster img{max-width:100%;max-height:62vh;max-height:62svh}
 .poster figcaption{margin-top:1.6rem}
 .poster .co{font-size:.64rem;letter-spacing:.1em}
}
</style>
</head>
<body>
<p class="mark mono">Trees of Vancouver</p>
<main>
<figure class="poster">
<img src="crop-1_red_oak_857_Malkin.jpg" alt="Watercolour of a red oak, Quercus rubra" width="706" height="771">
<figcaption>
<h2>Red oak</h2>
<p class="lat"><i>Quercus rubra</i></p>
<p class="co mono">49.275025, -123.082869</p>
</figcaption>
</figure>
<figure class="poster">
<img src="crop-2_london_plane_200_Semlin.jpg" alt="Watercolour of a london plane, Platanus × acerifolia" width="763" height="750">
<figcaption>
<h2>London plane</h2>
<p class="lat"><i>Platanus</i> × <i>acerifolia</i></p>
<p class="co mono">49.282714, -123.063486</p>
</figcaption>
</figure>
<figure class="poster">
<img src="crop-3_tulip_tree_4150_Knight.jpg" alt="Watercolour of a tulip tree, Liriodendron tulipifera" width="799" height="767">
<figcaption>
<h2>Tulip tree</h2>
<p class="lat"><i>Liriodendron tulipifera</i></p>
<p class="co mono">49.248048, -123.075707</p>
</figcaption>
</figure>
<figure class="poster">
<img src="crop-4_european_beech_900_W59th_v10.jpg" alt="Watercolour of a european beech, Fagus sylvatica" width="539" height="786">
<figcaption>
<h2>European beech</h2>
<p class="lat"><i>Fagus sylvatica</i></p>
<p class="co mono">49.216717, -123.127393</p>
</figcaption>
</figure>
<figure class="poster">
<img src="crop-5_katsura_1300_Pacific_original.jpg" alt="Watercolour of a katsura, Cercidiphyllum japonicum" width="819" height="755">
<figcaption>
<h2>Katsura</h2>
<p class="lat"><i>Cercidiphyllum japonicum</i></p>
<p class="co mono">49.271976, -123.123628</p>
</figcaption>
</figure>
</main>
</body>
</html>
