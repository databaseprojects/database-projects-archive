<!DOCTYPE html>

  <meta charset="utf-8">
  <script>
  window.FP_V = "20261108a";
  window.fpReadSaved = function () {
    var layout = "row";
    var cols = 6;
    try {
      layout = localStorage.getItem("fpLayout") || "row";
      cols = parseInt(localStorage.getItem("fpZoomCols"), 10);
    } catch (e) {}
    if (layout === "float") layout = "antigravity";
    if (layout !== "row" && layout !== "table" && layout !== "antigravity") layout = "row";
    cols = Math.round(+cols);
    if (!(cols >= 6 && cols <= 20)) cols = 6;
    return { layout: layout, cols: cols };
  };
  window.fpTagsReady = fetch("photo-tags.json?v=" + window.FP_V).then(function (res) {
    if (!res.ok) throw new Error("tags");
    return res.json();
  }).catch(function () { return null; });
  document.write('<link rel="stylesheet" href="../css/found.css?v=' + window.FP_V + '">');
  </script>
  <script>
  (function () {
    try {
      var saved = window.fpReadSaved();
      var scatter = saved.layout === "table" || saved.layout === "antigravity";
      if (!scatter && saved.cols === 6) return;
      document.documentElement.style.visibility = "hidden";
    } catch (e) {}
  })();
  </script>

    if (savedTags === "1" || (savedTags !== "0" && tagsPhone)) document.documentElement.classList.add("fp-tags-open");
  } catch (e) {}
